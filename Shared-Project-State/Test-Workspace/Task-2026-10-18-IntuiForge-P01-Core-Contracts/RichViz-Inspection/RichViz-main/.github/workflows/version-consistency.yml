name: Version Consistency
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate:version
      - run: npm test
