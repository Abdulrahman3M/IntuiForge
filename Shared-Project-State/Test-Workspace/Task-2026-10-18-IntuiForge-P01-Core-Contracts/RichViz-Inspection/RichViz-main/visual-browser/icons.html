<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the complete hand-authored Rich Viz icon library.">
  <title>Icons Library · Rich Viz</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="../src/gallery/theme.css?v=0.5.0"><link rel="stylesheet" href="browser.css?v=0.5.0">
</head>
<body data-asset-page="icons">
  <a class="skip-link" href="#asset-results">Skip to icons</a><div data-site-header></div>
  <main class="page-main">
    <section class="intro"><h1>Icons</h1><p>Browse every icon glyph included in the Rich Viz registry.</p><p class="page-copy">These are the library’s hand-authored, monochrome SVG icons. They are separate from artwork files and stickers, and can be referenced by their stable ID or icon name.</p></section>
    <section class="stats" aria-label="Icon library total"><div class="stat"><span class="stat-icon" aria-hidden="true">◇</span><p><strong id="page-total">…</strong><span> registered icons</span></p></div></section>
    <div class="library-toolbar"><label><span class="sr-only">Search icons</span><input id="asset-search" type="search" placeholder="Search by icon name or reference ID…" autocomplete="off"></label><label><span class="sr-only">Sort icons</span><select id="asset-sort"><option value="name">Name A–Z</option><option value="reference">Reference ID</option></select></label></div>
    <p class="library-count" id="asset-count" aria-live="polite"></p>
    <div class="card-grid" id="asset-results" aria-live="polite" aria-busy="true"></div>
  </main>
  <div data-site-footer></div>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><div class="dialog-heading"><p class="eyebrow">Icon details</p><h2 id="detail-title">Icon details</h2></div><button class="close" type="button" aria-label="Close details">×</button></div><div id="detail-content"></div></dialog>
  <script type="module" src="shell.js?v=0.5.0"></script><script type="module" src="asset-pages.js?v=0.5.0"></script>
</body>
</html>
