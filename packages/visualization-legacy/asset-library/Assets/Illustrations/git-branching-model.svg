<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Git branching model</title><desc id="desc">Feature branches converge through review into a protected main branch.</desc><style>text{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#173a32}text.small{font-size:14px;fill:#63766d}text.caption{font-size:16px;fill:#526a60}</style><rect x="18" y="18" width="684" height="424" rx="30" fill="#f8faf8"/><circle cx="652" cy="67" r="18" fill="#e7eee8"/><circle cx="677" cy="92" r="8" fill="#f1d8aa"/><path d="M125 130v230m0-145q0-90 125-90h270q80 0 80 80v155" fill="none" stroke="#236d54" stroke-width="8" stroke-linecap="round"/><path d="M125 286q0-82 120-82h160q75 0 75 75v72" fill="none" stroke="#7484c0" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#236d54" stroke-width="7"><circle cx="125" cy="130" r="17"/><circle cx="125" cy="230" r="17"/><circle cx="125" cy="360" r="17"/><circle cx="250" cy="100" r="17"/><circle cx="430" cy="279" r="17"/><circle cx="600" cy="360" r="17"/></g><rect x="450" y="72" width="160" height="54" rx="16" fill="#dcebe2"/><text x="530" y="106" text-anchor="middle">main · release</text><rect x="210" y="245" width="128" height="48" rx="14" fill="#e7e8f4"/><text x="274" y="276" text-anchor="middle" class="small">feature/*</text></svg>