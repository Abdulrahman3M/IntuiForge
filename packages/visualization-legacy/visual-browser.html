<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>IntuiForge Visual Library</title>
    <link rel="stylesheet" href="/packages/visualization-legacy/src/visual-browser.css">
  </head>
  <body>
    <main class="if-vb-page">
      <header class="if-vb-hero">
        <p class="if-vb-kicker">Visual library for IntuiForge</p>
        <h1>Find a visual, inspect its origin.</h1>
        <p>Explore diagrams, UI glyphs, illustrations, stickers and application icons. Previews are rendered from the same registries the engine uses; source and license remain visible.</p>
      </header>
      <section data-visual-browser class="if-vb-app" aria-label="Searchable visual library"></section>
      <footer class="if-vb-footer">RichViz v0.5.0 · local-only previews · no CDN assets</footer>
    </main>
    <script type="module" src="/packages/visualization-legacy/src/visual-browser.js"></script>
  </body>
</html>
