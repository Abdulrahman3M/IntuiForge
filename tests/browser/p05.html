<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>IntuiForge P05 — Portable Article</title>
  <style>
    html { background: #f5f7f4; color: #17231f; font: 16px/1.6 system-ui, sans-serif; }
    body { margin: 0; padding: 1rem; }
    #host { max-width: 92rem; margin-inline: auto; border-radius: 0; }
    #outside-probe { border-radius: 0; }
    #result { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <button id="outside-probe" type="button">Host style probe</button>
  <main id="host" aria-label="P05 article mount"></main>
  <output id="result" aria-live="polite">P05 fixture loading…</output>
  <script type="module" src="./p05.js"></script>
</body>
</html>
