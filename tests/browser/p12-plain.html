<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>IntuiForge P12 — Plain HTML Host</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; background: #f4f6f3; color: #17231f; }
    @media (prefers-color-scheme: dark) { :root { background: #111a16; color: #e8f0ec; } }
    body { margin: 0; padding: clamp(.75rem, 3vw, 2rem); }
    main { max-width: 72rem; margin-inline: auto; }
    header, footer { padding: 1rem; border: 1px solid #89958d; border-radius: .8rem; }
    #plain-mount, #legacy-copy, #route-mount { margin-block: 1rem; }
    #result { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="host-page">
    <header id="host-header"><h1>صفحة المضيف</h1><p>هذا الرأس وتنسيقه يملكه المضيف.</p></header>
    <div id="plain-mount">
      <article lang="en" dir="ltr"><h1>Static host fallback</h1><p>The static narrative remains available when JavaScript is disabled.</p><h2>Overview</h2><p>Markdown prose remains readable.</p></article>
    </div>
    <section id="route-mount" aria-label="Host route test"></section>
    <section aria-labelledby="legacy-heading"><h2 id="legacy-heading">Legacy RichViz host copy</h2><div id="legacy-copy"></div></section>
    <footer id="host-footer">محتوى المضيف يستمر خارج جذر المحرك.</footer>
    <output id="result" aria-live="polite">P12 fixture loading…</output>
  </main>
  <script type="module" src="./p12-host-fixtures.js"></script>
</body>
</html>
